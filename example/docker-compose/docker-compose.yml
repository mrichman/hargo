services:
  hargo:
    build:
      context: ../../
    image: hargo
    command: hargo load -u=http://influxdb:8086/hargo /testdata/golang.org.har
    volumes:
      - ../../testdata:/testdata
    depends_on:
      - influxdb
  influxdb:
    # hargo speaks the InfluxDB 1.x line protocol via influxdb1-client, so this
    # stays on the final 1.8.x release rather than 2.x/3.x.
    image: influxdb:1.8.10
    ports:
      - '8086:8086'
    volumes:
      - influxdb:/var/lib/influxdb
    environment:
      - INFLUXDB_DB=hargo
      - INFLUXDB_ADMIN_USER=hargo
      - INFLUXDB_ADMIN_PASSWORD=hargo
  grafana:
    image: grafana/grafana:11.6.6
    ports:
      - '3000:3000'
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning
    depends_on:
      - influxdb
    environment:
      - GF_SECURITY_ADMIN_USER=hargo
      - GF_SECURITY_ADMIN_PASSWORD=hargo
volumes:
  grafana:
  influxdb: